# Peter Tecnet entity SEO canonical and retired-product routes
#
# Production include:
#   include /etc/nginx/snippets/petertecnet-cutinapp-seo.conf;
#
# Keep canonical URLs without a trailing slash so they match JSON-LD,
# OpenGraph and sitemap URLs generated by scripts/generate-seo-pages.mjs.

location = /plataformas/cutinapp {
    try_files /plataformas/cutinapp/index.html =404;
}

location = /plataformas/cutinapp/ {
    return 301 https://petertecnet.com.br/plataformas/cutinapp;
}

location = /cutinapp {
    return 301 https://petertecnet.com.br/plataformas/cutinapp;
}

location = /cutinapp/ {
    return 301 https://petertecnet.com.br/plataformas/cutinapp;
}

location = /plataformas/cutinapp/confianca {
    return 301 https://petertecnet.com.br/cutinapp/confianca;
}

location = /plataformas/cutinapp/confianca/ {
    return 301 https://petertecnet.com.br/cutinapp/confianca;
}

location = /cutinapp/confianca {
    try_files /cutinapp/confianca/index.html =404;
}

location = /cutinapp/confianca/ {
    return 301 https://petertecnet.com.br/cutinapp/confianca;
}

# Retired products must never remain indexable as current Peter Tecnet platforms.
# Preserve any legacy authority by consolidating old URLs into the canonical
# ecosystem catalogue instead of serving stale SPA snapshots with HTTP 200.
location = /plataformas/inkap {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /plataformas/inkap/ {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /inkap {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /inkap/ {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /plataformas/kryvion {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /plataformas/kryvion/ {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /kryvion {
    return 301 https://petertecnet.com.br/plataformas;
}

location = /kryvion/ {
    return 301 https://petertecnet.com.br/plataformas;
}
