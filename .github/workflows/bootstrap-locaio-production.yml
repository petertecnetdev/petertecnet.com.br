name: Bootstrap Locaio Production

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-locaio-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Publish Locaio frontend on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate VPS configuration
        id: config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          echo "port=${VPS_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Checkout current Locaio main
        uses: actions/checkout@v4
        with:
          repository: petertecnetdev/locaio.petertecnet.com.br
          ref: main
          fetch-depth: 1
          path: locaio

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: locaio/package-lock.json

      - name: Build production frontend
        working-directory: locaio
        shell: bash
        env:
          CI: true
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          grep -Fq "peter-impersonation.js" index.html
          grep -Fq "Locaio" dist/index.html
          git rev-parse HEAD > "$RUNNER_TEMP/locaio-source-sha"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish atomic frontend release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(cat "$RUNNER_TEMP/locaio-source-sha")"
          ARCHIVE="$RUNNER_TEMP/locaio-${SOURCE_SHA}.tar.gz"
          REMOTE_ARCHIVE="/tmp/locaio-${SOURCE_SHA}.tar.gz"
          tar -C locaio/dist -czf "$ARCHIVE" .

          scp -q -P "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ARCHIVE" "$VPS_USER@$VPS_HOST:$REMOTE_ARCHIVE"

          ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$SOURCE_SHA' '$REMOTE_ARCHIVE'" <<'REMOTE'
          set -Eeuo pipefail
          SHA="$1"
          ARCHIVE="$2"
          TARGET="/var/www/locaio.petertecnet.com.br"
          LIVE="$TARGET/dist"
          NEXT="$TARGET/.dist.next.$SHA"
          PREVIOUS="$TARGET/.dist.previous.$SHA.$$"

          [[ "$TARGET" == /var/www/* ]] || exit 20
          [[ "$ARCHIVE" == /tmp/locaio-*.tar.gz ]] || exit 21
          test -d "$TARGET"
          test -w "$TARGET"
          test -f "$ARCHIVE"

          rm -rf "$NEXT" 2>/dev/null || true
          mkdir -p "$NEXT"
          tar -xzf "$ARCHIVE" -C "$NEXT"
          rm -f "$ARCHIVE"
          test -f "$NEXT/index.html"
          grep -Fq "Locaio" "$NEXT/index.html"

          if [[ -e "$LIVE" ]]; then mv "$LIVE" "$PREVIOUS"; fi
          if ! mv "$NEXT" "$LIVE"; then
            [[ -e "$PREVIOUS" ]] && mv "$PREVIOUS" "$LIVE" || true
            exit 22
          fi

          printf '%s\n' "$SHA" > "$TARGET/.locaio-main-release"
          rm -rf "$PREVIOUS" 2>/dev/null || true
          REMOTE

      - name: Verify public Locaio
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 20 https://locaio.petertecnet.com.br/)"
          grep -Fq "Locaio" <<<"$html"

          script_status="$(curl --silent --show-error --output /tmp/impersonation-runtime.js --write-out '%{http_code}' --max-time 20 https://petertecnet.com.br/ecosystem/peter-impersonation.js)"
          test "$script_status" = "200"
          grep -Fq "PeterTecnetImpersonation" /tmp/impersonation-runtime.js

          config_status="$(curl --silent --show-error --output /tmp/locaio-config.json --write-out '%{http_code}' --max-time 20 https://api.petertecnet.com.br/api/v1/apps/locaio/config)"
          test "$config_status" = "200"

          echo "Locaio frontend, shared impersonation runtime and API context are healthy."
