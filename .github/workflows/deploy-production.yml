name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/reusable-vps-deploy.yml
    with:
      deploy_path: /var/www/petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  verify-marketing:
    name: Verify public marketing and SEO experience
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public routes, canonical entities, PWA and sitemap
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://petertecnet.com.br/"
            "https://petertecnet.com.br/plataformas"
            "https://petertecnet.com.br/plataformas/plat"
            "https://petertecnet.com.br/plataformas/rasoio"
            "https://petertecnet.com.br/plataformas/cutinapp"
            "https://petertecnet.com.br/plataformas/nexus"
            "https://petertecnet.com.br/plataformas/payflow"
            "https://petertecnet.com.br/plataformas/laora"
            "https://petertecnet.com.br/plataformas/locaio"
            "https://petertecnet.com.br/plataformas/kryvion"
            "https://petertecnet.com.br/blog"
            "https://petertecnet.com.br/blog/agendamento-online-para-empresas-de-servicos"
            "https://petertecnet.com.br/blog/sistema-para-bares-restaurantes-e-estabelecimentos"
            "https://petertecnet.com.br/blog/plataforma-para-vender-ingressos-online"
            "https://petertecnet.com.br/blog/crm-para-pequenas-empresas-follow-up-propostas-cobrancas"
            "https://petertecnet.com.br/portfolio"
            "https://petertecnet.com.br/sobre"
            "https://petertecnet.com.br/orcamento"
            "https://petertecnet.com.br/sitemap.xml"
            "https://petertecnet.com.br/robots.txt"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "$url" >/dev/null
          done
          assert_contains() {
            local label="$1" needle="$2" haystack="$3"
            if ! grep -Fq "$needle" <<<"$haystack"; then echo "Verification failed: $label missing '$needle'." >&2; exit 1; fi
          }
          homepage="$(curl --fail --silent --show-error https://petertecnet.com.br/)"
          assert_contains "homepage ecosystem identity" "Ecossistema de plataformas digitais" "$homepage"
          assert_contains "homepage Plat entity" '"name":"Plat"' "$homepage"
          plat="$(curl --fail --silent --show-error https://petertecnet.com.br/plataformas/plat)"
          assert_contains "Plat canonical" '<link rel="canonical" href="https://petertecnet.com.br/plataformas/plat"' "$plat"
          assert_contains "Plat definition" "Plat é a plataforma Peter Tecnet para organizar e digitalizar a operação de estabelecimentos" "$plat"
          assert_contains "Plat software schema" "SoftwareApplication" "$plat"
          assert_contains "Plat product schema" '"Product"' "$plat"
          assert_contains "Plat breadcrumb schema" "BreadcrumbList" "$plat"
          assert_contains "Plat FAQ" "FAQPage" "$plat"
          platforms="$(curl --fail --silent --show-error https://petertecnet.com.br/plataformas)"
          assert_contains "platform directory H1" "Plataformas próprias para problemas específicos" "$platforms"
          assert_contains "platform directory structured list" "ItemList" "$platforms"
          sitemap="$(curl --fail --silent --show-error https://petertecnet.com.br/sitemap.xml)"
          for route in /plataformas/plat /plataformas/rasoio /plataformas/cutinapp /plataformas/nexus /plataformas/payflow /plataformas/laora /plataformas/locaio /plataformas/kryvion /blog/agendamento-online-para-empresas-de-servicos; do
            assert_contains "sitemap $route" "https://petertecnet.com.br$route" "$sitemap"
          done
          robots="$(curl --fail --silent --show-error https://petertecnet.com.br/robots.txt)"
          assert_contains "robots static sitemap" "https://petertecnet.com.br/sitemap.xml" "$robots"
          echo "Public production and SEO verification passed."
