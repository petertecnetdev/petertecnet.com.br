name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/reusable-vps-deploy.yml
    with:
      deploy_path: /var/www/petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  verify-marketing:
    name: Verify public marketing experience
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check commercial routes, content, CRM intake and live sitemap
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://petertecnet.com.br/"
            "https://petertecnet.com.br/blog"
            "https://petertecnet.com.br/servicos/desenvolvimento-de-software"
            "https://petertecnet.com.br/portfolio"
            "https://petertecnet.com.br/sobre"
            "https://petertecnet.com.br/orcamento"
            "https://petertecnet.com.br/robots.txt"
            "https://api.petertecnet.com.br/api/v1/discovery/sitemap.xml?origin=https%3A%2F%2Fpetertecnet.com.br"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 \
              "$url" >/dev/null
          done

          blog_html="$(curl --fail --silent --show-error --location --max-time 20 \
            https://petertecnet.com.br/blog)"
          grep -Fq "Blog Peter Tecnet" <<<"$blog_html"
          grep -Fq "como-criar-catalogo-digital-para-empresa" <<<"$blog_html"

          service_html="$(curl --fail --silent --show-error --location --max-time 20 \
            https://petertecnet.com.br/servicos/desenvolvimento-de-software)"
          grep -Fq "Desenvolvimento de software" <<<"$service_html"

          robots="$(curl --fail --silent --show-error --location --max-time 20 \
            https://petertecnet.com.br/robots.txt)"
          grep -Fq "api.petertecnet.com.br/api/v1/discovery/sitemap.xml" <<<"$robots"

          sitemap="$(curl --fail --silent --show-error --location --max-time 20 \
            'https://api.petertecnet.com.br/api/v1/discovery/sitemap.xml?origin=https%3A%2F%2Fpetertecnet.com.br')"
          grep -Fq "<urlset" <<<"$sitemap"

          # Non-mutating CRM probe: an empty inquiry must reach validation and return 422.
          # Any 401/403/404/5xx response means the public app context/capability route is broken.
          inquiry_status="$(curl --silent --show-error --output /tmp/inquiry-validation.json \
            --write-out '%{http_code}' --max-time 20 \
            --request POST --header 'Accept: application/json' \
            https://api.petertecnet.com.br/api/v1/apps/payflow/crm/inquiries)"
          if [[ "$inquiry_status" != "422" ]]; then
            echo "Expected CRM inquiry validation status 422, got $inquiry_status" >&2
            cat /tmp/inquiry-validation.json >&2 || true
            exit 1
          fi

          echo "Public marketing verification passed."
