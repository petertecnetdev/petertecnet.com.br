name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/reusable-vps-deploy.yml
    with:
      deploy_path: /var/www/petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  verify-marketing:
    name: Verify public marketing and entity SEO
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check canonical ecosystem pages and sitemap
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://petertecnet.com.br/"
            "https://petertecnet.com.br/plataformas"
            "https://petertecnet.com.br/plataformas/plat"
            "https://petertecnet.com.br/plataformas/rasoio"
            "https://petertecnet.com.br/plataformas/cutinapp"
            "https://petertecnet.com.br/plataformas/nexus"
            "https://petertecnet.com.br/plataformas/payflow"
            "https://petertecnet.com.br/plataformas/laora"
            "https://petertecnet.com.br/plataformas/locaio"
            "https://petertecnet.com.br/plataformas/kryvion"
            "https://petertecnet.com.br/blog"
            "https://petertecnet.com.br/sitemap.xml"
            "https://petertecnet.com.br/robots.txt"
          )
          for url in "${urls[@]}"; do curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "$url" >/dev/null; done
          plat="$(curl --fail --silent --show-error --location https://petertecnet.com.br/plataformas/plat)"
          grep -Fq '<link rel="canonical" href="https://petertecnet.com.br/plataformas/plat">' <<<"$plat"
          grep -Fq 'Plat: gestão digital para bares, restaurantes e estabelecimentos' <<<"$plat"
          grep -Fq 'SoftwareApplication' <<<"$plat"
          grep -Fq 'BreadcrumbList' <<<"$plat"
          platforms="$(curl --fail --silent --show-error --location https://petertecnet.com.br/plataformas)"
          grep -Fq 'A Peter Tecnet cria e opera um ecossistema de plataformas digitais próprias.' <<<"$platforms"
          sitemap="$(curl --fail --silent --show-error --location https://petertecnet.com.br/sitemap.xml)"
          grep -Fq 'https://petertecnet.com.br/plataformas/plat' <<<"$sitemap"
          echo "Public entity SEO verification passed."
