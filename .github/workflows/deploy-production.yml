name: Deploy Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.agents/**'
      - 'agents/**'
      - 'ecosystem-coordination/**'
      - 'AGENTS.md'
      - '.github/workflows/agent-chat-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-petertecnet-production
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/reusable-vps-deploy.yml
    with:
      deploy_path: /var/www/petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  verify-release:
    name: Verify exact production release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH fallback
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Confirm deployed commit and public essentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          normalize_sha() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/\\n$//'
          }

          verified=false
          for attempt in $(seq 1 6); do
            deployed_sha="$(curl --fail --silent --show-error --location --max-time 15 \
              -H 'Accept: text/plain' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://petertecnet.com.br/release-sha.txt?expected=${EXPECTED_SHA}&attempt=${attempt}" \
              2>/dev/null || true)"
            deployed_sha="$(normalize_sha "$deployed_sha")"

            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production release confirmed via public HTTPS: $deployed_sha"
              verified=true
              break
            fi

            deployed_sha="$(ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
              "cat /var/www/petertecnet.com.br/dist/release-sha.txt" \
              2>/dev/null || true)"
            deployed_sha="$(normalize_sha "$deployed_sha")"

            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production release confirmed via VPS artifact: $deployed_sha"
              verified=true
              break
            fi

            echo "Waiting for exact production release: expected=$EXPECTED_SHA actual=${deployed_sha:-unavailable} attempt=$attempt/6"
            sleep 3
          done

          if [[ "$verified" != true ]]; then
            echo "::error::Production release mismatch: expected=$EXPECTED_SHA actual=${deployed_sha:-unavailable}"
            exit 1
          fi

          urls=(
            "https://petertecnet.com.br/"
            "https://petertecnet.com.br/plataformas"
            "https://petertecnet.com.br/blog"
            "https://petertecnet.com.br/portfolio"
            "https://petertecnet.com.br/sobre"
            "https://petertecnet.com.br/orcamento"
            "https://petertecnet.com.br/sitemap.xml"
            "https://petertecnet.com.br/robots.txt"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 \
              -H 'Cache-Control: no-cache' "$url" >/dev/null
          done

          sitemap="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' https://petertecnet.com.br/sitemap.xml)"
          for route in /plataformas/plat /plataformas/rasoio /plataformas/cutinapp /plataformas/nexus /plataformas/payflow /plataformas/laora /plataformas/locaio; do
            if ! grep -Fq "https://petertecnet.com.br$route" <<<"$sitemap"; then
              echo "::error::Sitemap missing $route"
              exit 1
            fi
          done

          robots="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' https://petertecnet.com.br/robots.txt)"
          grep -Fq 'https://petertecnet.com.br/sitemap.xml' <<<"$robots" || {
            echo '::error::robots.txt does not reference the production sitemap.'
            exit 1
          }

          echo 'Production release, public routes and SEO essentials verified.'
