name: Admin Center Production (main)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admincenter/**'
      - 'scripts/validate-admin-ticket-sales-browser.mjs'
      - '.github/workflows/admincenter-production.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admincenter/**'
      - 'scripts/validate-admin-ticket-sales-browser.mjs'
      - '.github/workflows/admincenter-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admincenter-production-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate Admin Center and deploy from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admincenter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admincenter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify build
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q 'assets/' dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/release-sha.txt

      - name: Bundle budget
        run: npm run validate:bundle

      - name: Browser shell regression
        run: npm run validate:shell-browser

      - name: Production deployment mode
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          echo "Production deploy is pull-based on petertecnetserver."
          echo "The server checks origin/main every 30 seconds, validates the Admin Center, and publishes atomically."

      - name: Health check
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code="$(curl -L -sS -o /tmp/admincenter-health.html -w '%{http_code}' --max-time 15 https://admincenter.petertecnet.com.br/ || true)"
            if [[ "$code" == "200" ]]; then
              grep -q '<div id="root"></div>' /tmp/admincenter-health.html
              deployed_sha="$(curl -L -fsS --max-time 15 https://admincenter.petertecnet.com.br/release-sha.txt || true)"

              if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
                echo "Verified public Admin Center release: $deployed_sha"
                exit 0
              fi

              # Another main deployment can legitimately supersede this run while the
              # public health check is executing. Treat a newer descendant commit as
              # healthy instead of reporting a false deployment failure.
              if [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
                comparison="$(curl -fsSL \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$deployed_sha" || true)"
                comparison_status="$(printf '%s' "$comparison" | jq -r '.status // empty' 2>/dev/null || true)"
                if [[ "$comparison_status" == "ahead" || "$comparison_status" == "identical" ]]; then
                  echo "Release $GITHUB_SHA was superseded by newer healthy main release $deployed_sha."
                  exit 0
                fi
              fi

              echo "HTTP 200 but release SHA mismatch: expected=$GITHUB_SHA actual=$deployed_sha" >&2
            fi
            sleep 5
          done
          cat /tmp/admincenter-health.html || true
          exit 1
