name: Verify Locaio Browser Security

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-locaio-browser-security.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify HTTPS certificate, redirect and live assets
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="locaio.petertecnet.com.br"
          BASE="https://$DOMAIN"

          echo '=== Certificate ==='
          openssl s_client \
            -connect "$DOMAIN:443" \
            -servername "$DOMAIN" \
            -verify_hostname "$DOMAIN" \
            -verify_return_error </dev/null 2>/tmp/tls.err \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          openssl s_client \
            -connect "$DOMAIN:443" \
            -servername "$DOMAIN" \
            -verify_hostname "$DOMAIN" \
            -verify_return_error </dev/null 2>&1 \
            | grep -Fq 'Verify return code: 0 (ok)'

          echo '=== HTTP -> HTTPS redirect ==='
          curl --silent --show-error --head --max-time 20 "http://$DOMAIN/" > /tmp/http-headers.txt
          cat /tmp/http-headers.txt
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/http-headers.txt)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/http-headers.txt)"
          case "$status" in
            301|302|307|308) ;;
            *) echo "HTTP is not redirecting (status $status)." >&2; exit 21 ;;
          esac
          [[ "$location" == https://$DOMAIN/* ]] || { echo "Unexpected redirect: $location" >&2; exit 22; }

          echo '=== Live page ==='
          curl --fail --silent --show-error --location --max-time 20 "$BASE/" -o /tmp/locaio.html
          grep -Fq 'Locaio' /tmp/locaio.html

          rm -rf /tmp/locaio-assets
          mkdir -p /tmp/locaio-assets
          grep -oE '(src|href)="[^"]+"' /tmp/locaio.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | sed 's/&amp;/\&/g' \
            | sort -u > /tmp/assets.txt

          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            case "$asset" in
              https://*) url="$asset" ;;
              http://*|ws://*) echo "Insecure resource in HTML: $asset" >&2; exit 23 ;;
              //*) url="https:$asset" ;;
              /*) url="$BASE$asset" ;;
              *) continue ;;
            esac
            clean="${url%%\?*}"
            case "$clean" in
              *.js|*.css)
                file="/tmp/locaio-assets/$(printf '%s' "$clean" | sha256sum | awk '{print $1}')"
                curl --fail --silent --show-error --max-time 20 "$url" -o "$file"
                ;;
            esac
          done < /tmp/assets.txt

          echo '=== Mixed-content scan of deployed HTML/JS/CSS ==='
          if grep -R -n -E '(^|[^s])http://|ws://' /tmp/locaio.html /tmp/locaio-assets; then
            echo 'Insecure HTTP/WebSocket URL found in deployed frontend.' >&2
            exit 24
          fi

          echo '=== Security response headers ==='
          curl --fail --silent --show-error --head --max-time 20 "$BASE/" | tee /tmp/https-headers.txt

          echo 'Locaio passes TLS, redirect and deployed mixed-content checks.'
