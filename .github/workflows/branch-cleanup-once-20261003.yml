name: Branch cleanup once 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-merged-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified merged historical branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["feat/admin-productivity-suite-2026-09-03-final"]="bb5536a1db62453c7ec484630349f3a0d835c934"
            ["feat/admin-assisted-establishment-item-ux"]="4a046250fa170a7c326ce5d9605fcfd1a4250e28"
            ["improve/admin-2030-ui-2026-09-03"]="84b2dc34011aff499741c26d3df67b8e5170efc1"
            ["improve/admin-desktop-2026-09-03-v2"]="a2d78ca597759f576bbdee218817df6ad91f04ea"
            ["improve/admin-mobile-hamburger-2026-09-03"]="344654d2b9238830fcad29f9bbdf4e073f353286"
            ["improve/admin-center-mobile-2026-09-03"]="fa28d478bb2608c8d47436f2bbd700f05180854f"
            ["feat/landing-conversion-engine-2026"]="83850765728dbe721dc4c62ae7fb22c6aebb5bc3"
            ["feature/admin-command-center-v2"]="e40403e90c1952912ad526f8156c18c722d244d2"
            ["feature/laora-admin-center"]="6a47ccb2729e67e188267f913528192cb7e18c31"
            ["feature/advanced-financial-admin"]="da15e032b4b963daf11eebf347e06559d045f309"
            ["feature/peter-account-sso"]="cb624743a36d21376e92fe58b1ac76d2e54f0575"
            ["feature/positioning-solutions-nexus-services"]="e2e3a11f94c8476ef8fa2a2132da231fe1e951d2"
            ["feature/admin-activity-chart-20260831"]="ee6913b2b12736fe2bf732238419967d856b2dbc"
          )
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            if current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
              :
            else
              echo "Already absent: $branch"
              absent=$((absent+1))
              continue
            fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch"
              changed=$((changed+1))
              failures=$((failures+1))
              continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"
              deleted=$((deleted+1))
            else
              echo "FAILED to delete $branch"
              failures=$((failures+1))
            fi
          done
          echo "SUMMARY deleted=$deleted absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then exit 1; fi
