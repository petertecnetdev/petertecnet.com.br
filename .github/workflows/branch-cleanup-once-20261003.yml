name: Branch cleanup once 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-duplicate-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete allowlisted branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          branches=(
            "feat/admin-commercial-hardening-20260903"
            "feat/admin-commercial-hardening-final2-20260903"
            "feat/admin-commercial-hardening-final-20260903"
            "feat/admin-commercial-hardening-v3-pr"
            "feat/admin-commercial-hardening-v3-pr2"
            "feat/admin-hardening-all-20260903"
            "feat/admin-commercial-hardening-v3-final"
            "feat/admin-commercial-hardening-v3-impl"
            "feat/admin-commercial-hardening-v3-work"
            "feat/admin-commercial-hardening-v3"
            "feat/admin-productivity-suite-2026-09-03"
            "feat/admin-productivity-suite-2026-09-03-v2"
          )

          failures=0
          for branch in "${branches[@]}"; do
            echo "Checking $branch"
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
                echo "Deleted $branch"
              else
                echo "FAILED to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: $branch"
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "$failures branch deletions failed"
            exit 1
          fi

          echo "Verified allowlist deletion pass completed."
