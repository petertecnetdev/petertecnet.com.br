name: Branch cleanup once 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified merged branches
