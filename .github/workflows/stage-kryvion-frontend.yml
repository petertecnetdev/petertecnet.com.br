name: Stage Kryvion Frontend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage-kryvion-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: Build Kryvion on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate VPS configuration
        id: config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          echo "port=${VPS_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect hosting prerequisites
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          DOMAIN="kryvion.petertecnet.com.br"

          echo "=== identity ==="
          id

          echo "=== DNS ==="
          echo "Kryvion:"
          getent ahostsv4 "$DOMAIN" | awk '{print $1}' | sort -u || true
          echo "Locaio reference:"
          getent ahostsv4 locaio.petertecnet.com.br | awk '{print $1}' | sort -u || true
          echo "Peter Tecnet reference:"
          getent ahostsv4 petertecnet.com.br | awk '{print $1}' | sort -u || true

          echo "=== /var/www permissions ==="
          ls -ld /var/www /var/www/* 2>/dev/null || true
          echo "Writable app roots for this user:"
          for d in /var/www /var/www/*; do
            [[ -e "$d" ]] || continue
            [[ -w "$d" ]] && echo "$d"
          done

          echo "=== enabled Nginx sites ==="
          ls -l /etc/nginx/sites-enabled 2>/dev/null || true
          echo "=== server_name/root directives ==="
          grep -R -n -E '^[[:space:]]*(server_name|root)[[:space:]]' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          echo "=== Kryvion vhost matches ==="
          grep -R -n -F "$DOMAIN" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true

          echo "=== current loopback response for Kryvion Host header ==="
          curl -sS -I -H "Host: $DOMAIN" --max-time 5 http://127.0.0.1/ 2>&1 | head -n 20 || true
          REMOTE

      - name: Clone, build and stage Kryvion
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/kryvion.petertecnet.com.br"
          REPOSITORY="https://github.com/petertecnetdev/kryvion.petertecnet.com.br.git"

          exec 9>/tmp/petertecnet-vps-deploy.lock
          flock -w 1800 9

          if [[ -d "$APP_DIR/.git" ]]; then
            git -C "$APP_DIR" fetch --prune origin main
            git -C "$APP_DIR" checkout main
            git -C "$APP_DIR" reset --hard origin/main
          else
            mkdir -p "$(dirname "$APP_DIR")"
            if [[ -e "$APP_DIR" ]]; then
              test -z "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" || {
                echo "$APP_DIR exists and is not an empty Git checkout." >&2
                exit 23
              }
              rmdir "$APP_DIR" || true
            fi
            git clone --branch main --single-branch "$REPOSITORY" "$APP_DIR"
          fi

          cd "$APP_DIR"
          export CI=true
          export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=4096}"
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund --package-lock=false
          else
            npm install --no-audit --no-fund --package-lock=false
          fi
          npm run build
          test -f dist/index.html
          grep -Fq "Kryvion | Market Intelligence by Peter Tecnet" dist/index.html
          echo "Kryvion staged at $(git rev-parse HEAD)"
          REMOTE
