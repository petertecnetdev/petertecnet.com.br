name: Stage Kryvion Frontend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage-kryvion-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: Build Kryvion on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate VPS configuration
        id: config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          echo "port=${VPS_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Clone, build and stage Kryvion
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/kryvion.petertecnet.com.br"
          REPOSITORY="https://github.com/petertecnetdev/kryvion.petertecnet.com.br.git"

          exec 9>/tmp/petertecnet-vps-deploy.lock
          flock -w 1800 9

          if [[ -d "$APP_DIR/.git" ]]; then
            git -C "$APP_DIR" fetch --prune origin main
            git -C "$APP_DIR" checkout main
            git -C "$APP_DIR" reset --hard origin/main
          else
            mkdir -p "$(dirname "$APP_DIR")"
            if [[ -e "$APP_DIR" ]]; then
              test -z "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" || {
                echo "$APP_DIR exists and is not an empty Git checkout." >&2
                exit 23
              }
              rmdir "$APP_DIR" || true
            fi
            git clone --branch main --single-branch "$REPOSITORY" "$APP_DIR"
          fi

          cd "$APP_DIR"
          export CI=true
          export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=4096}"
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund --package-lock=false
          else
            npm install --no-audit --no-fund --package-lock=false
          fi
          npm run build
          test -f dist/index.html
          grep -Fq "Kryvion | Market Intelligence by Peter Tecnet" dist/index.html
          echo "Kryvion staged at $(git rev-parse HEAD)"
          REMOTE
