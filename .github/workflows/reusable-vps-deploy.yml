name: Reusable VPS Deploy

on:
  workflow_call:
    inputs:
      deploy_path:
        description: Absolute application path on the VPS.
        required: true
        type: string
      deploy_type:
        description: Deployment strategy (frontend or laravel).
        required: true
        type: string
      deploy_branch:
        description: Branch that must be deployed.
        required: true
        type: string
      health_url:
        description: Optional public URL checked after deployment.
        required: false
        default: ''
        type: string
    secrets:
      VPS_HOST:
        required: false
      VPS_PORT:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Peter Tecnet VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.deploy_branch }}
      cancel-in-progress: true

    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${VPS_HOST}" || -z "${VPS_USER}" || -z "${VPS_SSH_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automatic VPS deployment is installed but not enabled yet. Configure VPS_HOST, VPS_USER and VPS_SSH_KEY in Actions Secrets."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "port=${VPS_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy application
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # GitHub concurrency is repository-scoped. Spread the first SSH connection
          # across the ecosystem. Lock contention is handled with short connections
          # below so a queued deploy never occupies an idle SSH session on the VPS.
          repository_checksum="$(printf '%s' "$DEPLOY_REPOSITORY" | cksum | awk '{print $1}')"
          stagger_seconds=$((repository_checksum % 181))
          echo "Ecosystem SSH stagger for $DEPLOY_REPOSITORY: ${stagger_seconds}s"
          sleep "$stagger_seconds"

          REMOTE_SCRIPT_FILE="$RUNNER_TEMP/petertecnet-vps-deploy-remote.sh"
          cat > "$REMOTE_SCRIPT_FILE" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 002

          DEPLOY_PATH="$1"
          DEPLOY_TYPE="$2"
          DEPLOY_BRANCH="$3"

          if [[ "$DEPLOY_PATH" != /var/www/* ]]; then
            echo "Refusing deploy outside /var/www: $DEPLOY_PATH" >&2
            exit 20
          fi

          if [[ ! "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid deploy branch: $DEPLOY_BRANCH" >&2
            exit 21
          fi

          if [[ "$DEPLOY_TYPE" != "frontend" && "$DEPLOY_TYPE" != "laravel" ]]; then
            echo "Unsupported deploy type: $DEPLOY_TYPE" >&2
            exit 22
          fi

          # Every Peter Tecnet app shares this VPS. Acquire the global lock without
          # waiting inside SSH. Exit 75 means "busy, retry later" to the caller.
          # This prevents dozens of idle SSH sessions from exhausting sshd while
          # another application is building or running migrations.
          exec 9>/tmp/petertecnet-vps-deploy.lock
          if ! flock -n 9; then
            echo "Peter Tecnet VPS deployment lock is busy; retry later."
            exit 75
          fi

          cd "$DEPLOY_PATH"

          if [[ ! -d .git ]]; then
            echo "$DEPLOY_PATH is not a Git repository." >&2
            exit 23
          fi

          if [[ ! -w "$DEPLOY_PATH" ]]; then
            echo "$DEPLOY_PATH is not writable by the deploy user." >&2
            exit 24
          fi

          OLD_SHA="$(git rev-parse HEAD)"
          FRONTEND_BACKUP=""
          FRONTEND_OUTPUT=""

          restore_source() {
            echo "Restoring source revision $OLD_SHA after failed deployment..." >&2
            git reset --hard "$OLD_SHA" || true
          }

          restore_frontend() {
            if [[ -n "$FRONTEND_BACKUP" && -n "$FRONTEND_OUTPUT" ]]; then
              rm -rf "$FRONTEND_OUTPUT" || true
              if [[ -d "$FRONTEND_BACKUP" ]]; then
                mv "$FRONTEND_BACKUP" "$FRONTEND_OUTPUT" || true
              fi
            fi
          }

          on_error() {
            exit_code=$?
            echo "Deployment failed with exit code $exit_code." >&2
            restore_frontend
            restore_source
            exit "$exit_code"
          }

          trap on_error ERR

          git fetch --prune origin "$DEPLOY_BRANCH"

          if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
            git checkout "$DEPLOY_BRANCH"
          else
            git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          fi

          git reset --hard "origin/$DEPLOY_BRANCH"

          case "$DEPLOY_TYPE" in
            frontend)
              if [[ ! -f package.json ]]; then
                echo "package.json not found in $DEPLOY_PATH" >&2
                exit 30
              fi

              if grep -Eq '"vite"[[:space:]]*:' package.json; then
                FRONTEND_OUTPUT="dist"
              else
                FRONTEND_OUTPUT="build"
              fi

              FRONTEND_BACKUP="$DEPLOY_PATH/.deploy-backup-${FRONTEND_OUTPUT}-$(date +%s)-${OLD_SHA:0:8}"
              if [[ -d "$FRONTEND_OUTPUT" ]]; then
                mv "$FRONTEND_OUTPUT" "$FRONTEND_BACKUP"
              fi

              export CI=true
              export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=4096}"

              if [[ -f package-lock.json ]]; then
                if ! npm ci --no-audit --no-fund; then
                  echo "package-lock.json is not compatible with npm ci; falling back to npm install without modifying the lock file."
                  npm install --no-audit --no-fund --package-lock=false
                fi
              else
                npm install --no-audit --no-fund --package-lock=false
              fi

              npm run build

              if [[ ! -d "$FRONTEND_OUTPUT" ]]; then
                echo "Expected frontend output '$FRONTEND_OUTPUT' was not generated." >&2
                exit 31
              fi

              if [[ -d "$FRONTEND_BACKUP" ]]; then
                rm -rf "$FRONTEND_BACKUP" 2>/dev/null || echo "Legacy backup retained at $FRONTEND_BACKUP because old root-owned files could not be removed."
              fi
              FRONTEND_BACKUP=""
              ;;

            laravel)
              if [[ ! -f artisan || ! -f composer.json ]]; then
                echo "Laravel application files were not found in $DEPLOY_PATH" >&2
                exit 40
              fi

              composer install \
                --no-dev \
                --no-interaction \
                --prefer-dist \
                --optimize-autoloader

              chmod -R ug+rwX storage bootstrap/cache || true

              php artisan optimize:clear
              php artisan migrate --force
              php artisan config:cache
              php artisan view:cache
              php artisan queue:restart || true
              php artisan reverb:restart || true
              ;;
          esac

          trap - ERR

          NEW_SHA="$(git rev-parse HEAD)"
          echo "Deployment completed: $OLD_SHA -> $NEW_SHA"
          REMOTE_SCRIPT

          chmod 600 "$REMOTE_SCRIPT_FILE"

          # The VPS lock is intentionally non-blocking inside SSH. A busy lock (75)
          # or a transport failure (255) closes the connection and retries later with
          # deterministic jitter. Real build/migration failures still fail immediately.
          max_attempts=50
          for attempt in $(seq 1 "$max_attempts"); do
            echo "SSH deploy attempt $attempt/$max_attempts"
            if ssh \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=8 \
              -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "bash -s -- '$DEPLOY_PATH' '$DEPLOY_TYPE' '$DEPLOY_BRANCH'" \
              < "$REMOTE_SCRIPT_FILE"; then
              exit 0
            else
              exit_code=$?
            fi

            if [[ "$exit_code" -ne 75 && "$exit_code" -ne 255 ]]; then
              echo "Remote deployment failed with non-retryable exit code $exit_code." >&2
              exit "$exit_code"
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              if [[ "$exit_code" -eq 75 ]]; then
                echo "VPS deployment lock remained busy after $max_attempts attempts." >&2
              else
                echo "SSH transport remained unavailable after $max_attempts attempts." >&2
              fi
              exit "$exit_code"
            fi

            # 30-60 seconds, varied by repository and attempt. This spaces queued
            # repositories without synchronized reconnect storms against sshd.
            sleep_seconds=$((30 + (repository_checksum + attempt * 17) % 31))
            if [[ "$exit_code" -eq 75 ]]; then
              echo "VPS deploy lock busy; reconnecting in ${sleep_seconds}s..."
            else
              echo "Transient SSH failure; reconnecting in ${sleep_seconds}s..."
            fi
            sleep "$sleep_seconds"
          done

      - name: Health check
        if: steps.config.outputs.enabled == 'true' && inputs.health_url != ''
        shell: bash
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 20 \
            "$HEALTH_URL" >/dev/null
          echo "Health check passed: $HEALTH_URL"
