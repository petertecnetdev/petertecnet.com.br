name: Reusable VPS Deploy

on:
  workflow_call:
    inputs:
      deploy_path:
        description: Absolute application path on the VPS.
        required: true
        type: string
      deploy_type:
        description: Deployment strategy (frontend or laravel).
        required: true
        type: string
      deploy_branch:
        description: Branch that must be deployed.
        required: true
        type: string
      health_url:
        description: Optional public URL checked after deployment.
        required: false
        default: ''
        type: string
    secrets:
      VPS_HOST:
        required: false
      VPS_PORT:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Peter Tecnet VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.deploy_branch }}
      cancel-in-progress: true

    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST}" || -z "${VPS_USER}" || -z "${VPS_SSH_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automatic VPS deployment is installed but not enabled."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "port=${VPS_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Checkout frontend source
        if: steps.config.outputs.enabled == 'true' && inputs.deploy_type == 'frontend'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node for frontend build
        if: steps.config.outputs.enabled == 'true' && inputs.deploy_type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch frontend build environment
        if: steps.config.outputs.enabled == 'true' && inputs.deploy_type == 'frontend'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        run: |
          set -euo pipefail
          ssh_opts=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          retry() {
            local attempt=1 max_attempts=4 delay=10
            until "$@"; do
              if (( attempt >= max_attempts )); then return 1; fi
              echo "SSH transport failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          for env_file in .env .env.local .env.production .env.production.local .npmrc; do
            if retry ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f '$DEPLOY_PATH/$env_file'"; then
              retry scp -q -P "$VPS_PORT" "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/$env_file" "$env_file"
            fi
          done

      - name: Build frontend on GitHub runner
        id: frontend_build
        if: steps.config.outputs.enabled == 'true' && inputs.deploy_type == 'frontend'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export CI=true
          export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=4096}"
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --package-lock=false
          fi
          npm run build
          npm run perf:budget --if-present
          if [[ -d dist && -f dist/index.html ]]; then
            output=dist
          elif [[ -d build && -f build/index.html ]]; then
            output=build
          else
            echo "Frontend build produced neither dist/index.html nor build/index.html." >&2
            exit 31
          fi
          oversized="$(find "$output" -type f \( -name '*.js' -o -name '*.css' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.avif' -o -name '*.gif' -o -name '*.ico' \) -size +2048k -print -quit)"
          if [[ -n "$oversized" ]]; then
            echo "Performance budget exceeded: $oversized is larger than 2 MiB." >&2
            exit 32
          fi
          artifact="$RUNNER_TEMP/petertecnet-frontend-release.tgz"
          tar -czf "$artifact" "$output"
          repository_checksum="$(printf '%s' "$DEPLOY_REPOSITORY" | cksum | awk '{print $1}')"
          remote_artifact="/tmp/petertecnet-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${repository_checksum}.tgz"
          ssh_opts=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          upload_release() {
            local attempt=1 max_attempts=4 delay=10
            until scp -q -P "$VPS_PORT" "${ssh_opts[@]}" "$artifact" "$VPS_USER@$VPS_HOST:$remote_artifact"; do
              if (( attempt >= max_attempts )); then
                echo "Could not upload frontend artifact after ${max_attempts} attempts." >&2
                return 1
              fi
              echo "Frontend artifact upload failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          upload_release
          echo "output_name=$output" >> "$GITHUB_OUTPUT"
          echo "remote_artifact=$remote_artifact" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy application
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          FRONTEND_OUTPUT: ${{ steps.frontend_build.outputs.output_name }}
          FRONTEND_ARTIFACT: ${{ steps.frontend_build.outputs.remote_artifact }}
          FRONTEND_SOURCE_SHA: ${{ steps.frontend_build.outputs.source_sha }}
        run: |
          set -euo pipefail

          repository_checksum="$(printf '%s' "$DEPLOY_REPOSITORY" | cksum | awk '{print $1}')"
          stagger_seconds=$((repository_checksum % 11))
          echo "Ecosystem SSH stagger for $DEPLOY_REPOSITORY: ${stagger_seconds}s"
          sleep "$stagger_seconds"

          REMOTE_SCRIPT_FILE="$RUNNER_TEMP/petertecnet-vps-deploy-remote.sh"
          cat > "$REMOTE_SCRIPT_FILE" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 002

          DEPLOY_PATH="$1"
          DEPLOY_TYPE="$2"
          DEPLOY_BRANCH="$3"
          DEPLOY_REPOSITORY="$4"
          FRONTEND_ARTIFACT="${5:-}"
          FRONTEND_OUTPUT_HINT="${6:-}"
          FRONTEND_SOURCE_SHA="${7:-}"
          RELEASE_EXTRACT=""

          on_exit() {
            if [[ -n "$RELEASE_EXTRACT" && -d "$RELEASE_EXTRACT" ]]; then
              rm -rf "$RELEASE_EXTRACT" 2>/dev/null || true
            fi
            if [[ -n "$FRONTEND_ARTIFACT" && "$FRONTEND_ARTIFACT" == /tmp/petertecnet-frontend-*.tgz ]]; then
              rm -f "$FRONTEND_ARTIFACT" 2>/dev/null || true
            fi
          }
          trap on_exit EXIT

          if [[ "$DEPLOY_PATH" != /var/www/* ]]; then
            echo "Refusing deploy outside /var/www: $DEPLOY_PATH" >&2
            exit 20
          fi
          if [[ ! "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid deploy branch: $DEPLOY_BRANCH" >&2
            exit 21
          fi
          if [[ "$DEPLOY_TYPE" != "frontend" && "$DEPLOY_TYPE" != "laravel" ]]; then
            echo "Unsupported deploy type: $DEPLOY_TYPE" >&2
            exit 22
          fi
          if [[ ! "$DEPLOY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid GitHub repository: $DEPLOY_REPOSITORY" >&2
            exit 25
          fi

          exec 9>/tmp/petertecnet-vps-deploy.lock
          echo "Waiting for Peter Tecnet VPS deployment slot..."
          if ! flock -w 2700 9; then
            echo "Timed out waiting for Peter Tecnet VPS deployment slot." >&2
            exit 75
          fi
          echo "Peter Tecnet VPS deployment slot acquired."

          # Protect the shared VPS from deployments that could exhaust the root filesystem.
          # A full disk can interrupt databases, queues, logs and payment-critical API writes.
          disk_probe="$DEPLOY_PATH"
          [[ -e "$disk_probe" ]] || disk_probe="/var/www"
          free_kb="$(df -Pk "$disk_probe" | awk 'NR==2 {print $4}')"
          min_free_kb=$((3 * 1024 * 1024))
          warn_free_kb=$((5 * 1024 * 1024))
          if [[ ! "$free_kb" =~ ^[0-9]+$ ]]; then
            echo "Could not determine free disk space for $disk_probe." >&2
            exit 28
          fi
          echo "VPS free disk before deploy: $((free_kb / 1024)) MiB"

          # When capacity is tight, reclaim only dependency trees from stale, non-production
          # workspaces. Source, Git history, builds, uploads, databases and live applications
          # are never touched. A .keep-dependencies marker opts any workspace out.
          if (( free_kb < warn_free_kb )); then
            echo "VPS has less than 5 GiB free; checking stale non-production dependencies."
            while IFS= read -r -d '' dependency_dir; do
              workspace="$(dirname "$dependency_dir")"
              workspace_name="$(basename "$workspace")"

              [[ "$(dirname "$workspace")" == "/var/www" ]] || continue
              [[ "$workspace" != "$DEPLOY_PATH" ]] || continue
              [[ ! -e "$workspace/.keep-dependencies" ]] || continue
              case "$workspace_name" in
                *.petertecnet.com.br|html|_deploy-quarantine) continue ;;
              esac

              # Do not interfere with workspaces whose source changed in the last 24h.
              recent_source="$(find "$workspace" -mindepth 1 -maxdepth 4 \
                -path "$dependency_dir" -prune -o \
                -path "$workspace/.git" -prune -o \
                -type f -mmin -1440 -print -quit 2>/dev/null || true)"
              [[ -z "$recent_source" ]] || continue

              dependency_kb="$(du -sk "$dependency_dir" 2>/dev/null | awk '{print $1}' || true)"
              echo "Reclaiming regenerable dependencies: $dependency_dir (${dependency_kb:-0} KiB)"
              if ! rm -rf "$dependency_dir" 2>/dev/null; then
                sudo -n rm -rf "$dependency_dir" 2>/dev/null || echo "Could not remove $dependency_dir; leaving it untouched."
              fi
            done < <(find /var/www -mindepth 2 -maxdepth 2 -type d \
              \( -name node_modules -o -name vendor \) -mmin +1440 -print0 2>/dev/null)

            free_kb="$(df -Pk "$disk_probe" | awk 'NR==2 {print $4}')"
            echo "VPS free disk after safe dependency cleanup: $((free_kb / 1024)) MiB"
          fi

          if (( free_kb < min_free_kb )); then
            echo "Refusing deploy: less than 3 GiB free on the VPS filesystem after safe cleanup." >&2
            exit 28
          fi
          if (( free_kb < warn_free_kb )); then
            echo "WARNING: VPS remains below 5 GiB free. Capacity cleanup should be prioritized."
          fi

          if [[ ! -d "$DEPLOY_PATH/.git" ]]; then
            if [[ -d "$DEPLOY_PATH" && -n "$(ls -A "$DEPLOY_PATH" 2>/dev/null)" ]]; then
              echo "$DEPLOY_PATH exists, is not a Git repository and is not empty." >&2
              exit 23
            fi
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            rm -rf "$DEPLOY_PATH"
            echo "Bootstrapping $DEPLOY_REPOSITORY into $DEPLOY_PATH..."
            git clone --branch "$DEPLOY_BRANCH" --single-branch "https://github.com/$DEPLOY_REPOSITORY.git" "$DEPLOY_PATH"
          fi

          cd "$DEPLOY_PATH"
          if [[ ! -d .git ]]; then
            echo "$DEPLOY_PATH is not a Git repository." >&2
            exit 23
          fi
          if [[ ! -w "$DEPLOY_PATH" ]]; then
            echo "$DEPLOY_PATH is not writable by the deploy user." >&2
            exit 24
          fi

          # Atomic frontend deploys create dot-prefixed sibling releases. If a previous
          # run was interrupted after activation, these directories are deployment
          # artifacts rather than manual source edits. Clean them before checking the
          # working tree. Legacy root-owned leftovers are cleaned once by server maintenance;
          # normal deploy artifacts are owned by the deploy user and need no sudo.
          for stale_release in .build.next.* .build.previous.* .build.failed.* .dist.next.* .dist.previous.* .dist.failed.*; do
            [[ -e "$stale_release" ]] || continue
            rm -rf "$stale_release" 2>/dev/null || true
          done

          OLD_SHA="$(git rev-parse HEAD)"
          git fetch --prune origin "$DEPLOY_BRANCH"
          TARGET_SHA="$(git rev-parse "origin/$DEPLOY_BRANCH")"

          case "$DEPLOY_TYPE" in
            frontend)
              # Frontend compilation runs on the GitHub-hosted runner. The production VPS
              # only verifies the target SHA, extracts the ready release and swaps it atomically.
              [[ -n "$FRONTEND_ARTIFACT" && -f "$FRONTEND_ARTIFACT" ]] || { echo "Frontend artifact was not uploaded." >&2; exit 30; }
              [[ "$FRONTEND_OUTPUT_HINT" == "build" || "$FRONTEND_OUTPUT_HINT" == "dist" ]] || { echo "Invalid frontend output name." >&2; exit 30; }
              [[ -n "$FRONTEND_SOURCE_SHA" && "$TARGET_SHA" == "$FRONTEND_SOURCE_SHA" ]] || {
                echo "Frontend artifact SHA $FRONTEND_SOURCE_SHA does not match deploy target $TARGET_SHA." >&2
                exit 30
              }
              FRONTEND_OUTPUT="$FRONTEND_OUTPUT_HINT"
              RELEASE_EXTRACT="/tmp/petertecnet-release-$(basename "$DEPLOY_PATH" | tr -c 'A-Za-z0-9._-' '-')-$$-$RANDOM"
              mkdir -p "$RELEASE_EXTRACT"
              tar -xzf "$FRONTEND_ARTIFACT" -C "$RELEASE_EXTRACT"
              NEW_OUTPUT="$RELEASE_EXTRACT/$FRONTEND_OUTPUT"

              LIVE_OUTPUT="$DEPLOY_PATH/$FRONTEND_OUTPUT"
              NEXT_OUTPUT="$DEPLOY_PATH/.${FRONTEND_OUTPUT}.next.$$-$RANDOM"
              PREVIOUS_OUTPUT="$DEPLOY_PATH/.${FRONTEND_OUTPUT}.previous.$$-$RANDOM"
              [[ -f "$NEW_OUTPUT/index.html" ]] || { echo "New frontend release has no $FRONTEND_OUTPUT/index.html." >&2; exit 31; }

              # Build a complete release beside the live directory. Replacing the directory
              # avoids writing over files that may be owned/read-only from older deployments.
              rm -rf "$NEXT_OUTPUT"
              cp -a "$NEW_OUTPUT" "$NEXT_OUTPUT"

              # Keep recently published Vite content hashes reachable while open browser tabs
              # transition between releases. Hashed filenames are immutable, so retaining them
              # cannot replace the new release; files older than seven days are pruned.
              if [[ -d "$LIVE_OUTPUT/assets" && -d "$NEXT_OUTPUT/assets" ]]; then
                echo "Retaining compatible Vite assets from the previous release..."
                cp -a -n "$LIVE_OUTPUT/assets/." "$NEXT_OUTPUT/assets/" 2>/dev/null || true
                find "$NEXT_OUTPUT/assets" -type f -mtime +7 -delete 2>/dev/null || true
                find "$NEXT_OUTPUT/assets" -type d -empty -delete 2>/dev/null || true
              fi

              [[ -f "$NEXT_OUTPUT/index.html" ]] || { echo "Prepared frontend release has no index.html." >&2; exit 31; }

              if [[ -e "$LIVE_OUTPUT" ]]; then
                mv "$LIVE_OUTPUT" "$PREVIOUS_OUTPUT"
              fi
              if ! mv "$NEXT_OUTPUT" "$LIVE_OUTPUT"; then
                echo "Failed to activate new frontend release; attempting rollback." >&2
                [[ -e "$PREVIOUS_OUTPUT" ]] && mv "$PREVIOUS_OUTPUT" "$LIVE_OUTPUT" || true
                exit 32
              fi

              cmp -s "$NEW_OUTPUT/index.html" "$LIVE_OUTPUT/index.html" || {
                echo "Published frontend index.html differs from freshly built release; attempting rollback." >&2
                rm -rf "$NEXT_OUTPUT" || true
                if [[ -e "$PREVIOUS_OUTPUT" ]]; then
                  FAILED_OUTPUT="$DEPLOY_PATH/.${FRONTEND_OUTPUT}.failed.$$-$RANDOM"
                  mv "$LIVE_OUTPUT" "$FAILED_OUTPUT" || true
                  mv "$PREVIOUS_OUTPUT" "$LIVE_OUTPUT" || true
                  rm -rf "$FAILED_OUTPUT" 2>/dev/null || true
                fi
                exit 32
              }

              # Cleanup is best-effort and deliberately does not use sudo from CI.
              # New releases are created by the deploy user, so normal cleanup remains writable.
              if [[ -e "$PREVIOUS_OUTPUT" ]]; then
                rm -rf "$PREVIOUS_OUTPUT" 2>/dev/null || true
              fi
              ;;
            laravel)
              LOCAL_SOURCE_CHANGES="$(git status --porcelain=v1 --untracked-files=all | awk '
                {
                  path = substr($0, 4)
                  if (path ~ /^(storage\/|bootstrap\/cache\/|node_modules\/|vendor\/|dist\/|build\/|artifacts\/|\.automation-evolve\/)/) next
                  if (path ~ /^\.(build|dist)\.(next|previous|failed)\./) next
                  if (path ~ /^(build|dist)\.rollback\.[0-9]{14}\//) next
                  if (path ~ /^\.env($|\.)/) next
                  if (path ~ /\.bak\.[0-9]{8}-[0-9]{6}-[0-9]+$/) next
                  print
                }
              ')"
              if [[ -n "$LOCAL_SOURCE_CHANGES" ]]; then
                echo "Refusing deploy: uncommitted source work exists in $DEPLOY_PATH." >&2
                printf '%s\n' "$LOCAL_SOURCE_CHANGES" >&2
                exit 26
              fi
              if ! git merge-base --is-ancestor "$OLD_SHA" "$TARGET_SHA"; then
                echo "Refusing deploy: local commits would be discarded in $DEPLOY_PATH." >&2
                git log --oneline --decorate "$TARGET_SHA..$OLD_SHA" >&2 || true
                exit 27
              fi
              if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then git checkout "$DEPLOY_BRANCH"; else git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"; fi
              git reset --hard "$TARGET_SHA"
              [[ -f artisan && -f composer.json ]] || { echo "Laravel application files were not found in $DEPLOY_PATH" >&2; exit 40; }
              nice -n 10 composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
              chmod -R ug+rwX storage bootstrap/cache || true
              sudo -u www-data -- php artisan optimize:clear
              sudo -u www-data -- php artisan migrate --force
              sudo -u www-data -- php artisan config:cache
              sudo -u www-data -- php artisan view:cache
              if [[ -f config/cognition.php ]]; then
                php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class); $kernel->bootstrap(); echo "Cognitive core: ".(config("cognition.enabled") ? "enabled" : "disabled").PHP_EOL;'
              fi
              sudo -u www-data -- php artisan queue:restart || true
              sudo -u www-data -- php artisan reverb:restart || true
              ;;
          esac
          cd "$DEPLOY_PATH"
          if [[ "$DEPLOY_TYPE" == "frontend" ]]; then
            NEW_SHA="$TARGET_SHA"
          else
            NEW_SHA="$(git rev-parse HEAD)"
          fi
          echo "Deployment completed: $OLD_SHA -> $NEW_SHA"
          REMOTE_SCRIPT
          chmod 600 "$REMOTE_SCRIPT_FILE"
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "SSH deploy attempt $attempt/$max_attempts"
            if ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ConnectionAttempts=1 -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$DEPLOY_PATH' '$DEPLOY_TYPE' '$DEPLOY_BRANCH' '$DEPLOY_REPOSITORY' '$FRONTEND_ARTIFACT' '$FRONTEND_OUTPUT' '$FRONTEND_SOURCE_SHA'" < "$REMOTE_SCRIPT_FILE"; then exit 0; else exit_code=$?; fi
            if [[ "$exit_code" -ne 75 && "$exit_code" -ne 255 ]]; then exit "$exit_code"; fi
            [[ "$attempt" -eq "$max_attempts" ]] && exit "$exit_code"
            sleep_seconds=$((10 + (repository_checksum + attempt * 7) % 11))
            sleep "$sleep_seconds"
          done

      - name: Health check
        if: steps.config.outputs.enabled == 'true' && inputs.health_url != ''
        shell: bash
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 20 "$HEALTH_URL" >/dev/null
          echo "Health check passed: $HEALTH_URL"
