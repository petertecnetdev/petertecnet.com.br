name: Diagnose Locaio VHost

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-locaio-vhost.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probe administrative SSH access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          echo 'Configured deploy identity:'
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 -p "$port" "$VPS_USER@$VPS_HOST" 'id; echo deploy-ok'

          echo 'Root key probe:'
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 -p "$port" "root@$VPS_HOST" 'id; echo root-ok'; then
            echo 'ROOT_SSH_AVAILABLE=yes'
          else
            echo 'ROOT_SSH_AVAILABLE=no'
          fi
