name: Peter Tecnet Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate ecosystem SDK
        run: npm run test:ecosystem
      - name: Production build
        run: npm run build
      - name: Verify command center sources
        shell: bash
        run: |
          test -f src/CommandCenter.jsx
          test -f src/CriticalEventsPanel.jsx
          test -f src/OperationalIssuesPanel.jsx
          test -f src/OperationalIssuesPanel.css
          test -f src/FinancialCenter.jsx
          test -f src/EcosystemLauncherAdmin.jsx
          test -f src/AdminExperience.css
          test -f src/AdminVisualSystem.css
          test -f src/components/AdminMobileNavigation.css
          test -f public/ecosystem/peter-ecosystem.js
          test ! -f src/AdminResponsive.css
          test ! -f src/AdminDesktop.css
          test ! -f src/AdminMobileNavigation.css
          grep -q "Mission Control" src/Admin.jsx
          grep -q "command/overview" src/CommandCenter.jsx
          grep -q "command/security" src/CommandCenter.jsx
          grep -q "command/issues" src/CommandCenter.jsx
          grep -q "command/intelligence" src/CommandCenter.jsx
          grep -q "issues/.*intelligence" src/CommandCenter.jsx
          grep -q "repair-plan" src/CommandCenter.jsx
          grep -q "OperationalIssuesPanel" src/CommandCenter.jsx
          grep -q "Causa provável" src/OperationalIssuesPanel.jsx
          grep -q "SLO / confiabilidade" src/OperationalIssuesPanel.jsx
          grep -q "Rollback inteligente" src/OperationalIssuesPanel.jsx
          grep -q "AUTOMAÇÃO SUPERVISIONADA" src/OperationalIssuesPanel.jsx
          grep -q "financial/orders" src/FinancialCenter.jsx
          grep -q "ecosystem-launcher" src/main.jsx
          grep -q "AdminVisualSystem.css" src/main.jsx
          grep -q "AdminExperience.css" src/main.jsx
          grep -q "./AdminMobileNavigation.css" src/components/AdminMobileNavigation.jsx
          ! grep -q "AdminResponsive.css" src/main.jsx
          ! grep -q "AdminDesktop.css" src/main.jsx
          ! grep -q "AdminMobileNavigation.css" src/main.jsx
