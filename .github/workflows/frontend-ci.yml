name: Peter Tecnet Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate ecosystem SDK
        run: npm run test:ecosystem
      - name: Production build
        run: npm run build
      - name: Validate Admin Center in real browser
        run: npm run test:admin-ui
      - name: Upload Admin Center viewport captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-viewports
          path: artifacts/admin-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify command center sources
        shell: bash
        run: |
          test -f src/CommandCenter.jsx
          test -f src/missionControlRealtime.js
          test -f src/CriticalEventsPanel.jsx
          test -f src/OperationalIssuesPanel.jsx
          test -f src/OperationalIssuesPanel.css
          test -f src/FinancialCenter.jsx
          test -f src/EcosystemLauncherAdmin.jsx
          test -f src/AdminEntry.jsx
          test -f src/AdminExperience.css
          test -f src/AdminVisualSystem.css
          test -f src/admin/AdminTokens.css
          test -f src/admin/AdminNavigationConfig.js
          test -f src/admin/AdminUiContext.jsx
          test -f src/admin/AdminNavigationState.css
          test -f src/admin/AdminFutureTheme.css
          test -f src/admin/AdminSidebarRefinement.css
          test -f src/components/AdminMobileNavigation.css
          test -f scripts/validate-admin-browser.mjs
          test -f public/ecosystem/peter-ecosystem.js
          test ! -f src/AdminResponsive.css
          test ! -f src/AdminDesktop.css
          test ! -f src/AdminMobileNavigation.css
          grep -q "Mission Control" src/Admin.jsx
          grep -q "command/overview" src/CommandCenter.jsx
          grep -q "command/security" src/CommandCenter.jsx
          grep -q "command/issues" src/CommandCenter.jsx
          grep -q "repair-plan" src/CommandCenter.jsx
          grep -q "OperationalIssuesPanel" src/CommandCenter.jsx
          grep -q "observability_score" src/CommandCenter.jsx
          grep -q "connectMissionControlRealtime" src/CommandCenter.jsx
          grep -q "realtime-config" src/missionControlRealtime.js
          grep -q "mission-control.updated" src/missionControlRealtime.js
          ! grep -q "command/intelligence" src/CommandCenter.jsx
          ! grep -q "issues/.*intelligence" src/CommandCenter.jsx
          grep -q "Causa provável" src/OperationalIssuesPanel.jsx
          grep -q "SLO / confiabilidade" src/OperationalIssuesPanel.jsx
          grep -q "Rollback inteligente" src/OperationalIssuesPanel.jsx
          grep -q "AUTOMAÇÃO SUPERVISIONADA" src/OperationalIssuesPanel.jsx
          grep -q "financial/orders" src/FinancialCenter.jsx
          grep -q "AdminEntry" src/main.jsx
          grep -q "ecosystem-launcher" src/AdminEntry.jsx
          grep -q "AdminVisualSystem.css" src/AdminEntry.jsx
          grep -q "AdminExperience.css" src/AdminEntry.jsx
          grep -q "AdminFutureTheme.css" src/AdminEntry.jsx
          grep -q "AdminSidebarRefinement.css" src/AdminEntry.jsx
          grep -q "AdminTokens.css" src/AdminEntry.jsx
          grep -q "AdminUiProvider" src/AdminEntry.jsx
          grep -q "data-icon" src/admin/AdminNavigationState.css
          grep -q "data-admin-tab='command'" src/admin/AdminSidebarRefinement.css
          grep -q "data-pto-onboarding" src/admin/AdminUiProvider.jsx
          grep -q "admin-home-nav-button" src/admin/AdminUiProvider.jsx
          grep -q "focusables" src/components/AdminMobileNavigation.jsx
          grep -q "drawer.inert" src/components/AdminMobileNavigation.jsx
          grep -q "./AdminMobileNavigation.css" src/components/AdminMobileNavigation.jsx
          ! grep -q "AdminResponsive.css" src/main.jsx
          ! grep -q "AdminDesktop.css" src/main.jsx
          ! grep -q "AdminMobileNavigation.css" src/main.jsx
          ! grep -q "AdminTokens.css" src/main.jsx
          ! grep -q "AdminVisualSystem.css" src/main.jsx
          ! grep -q "AdminExperience.css" src/main.jsx
          ! grep -q "AdminFutureTheme.css" src/main.jsx
          ! grep -q "AdminSidebarRefinement.css" src/main.jsx
