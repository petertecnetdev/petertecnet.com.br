name: Peter Tecnet Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate article Markdown links and CTA safety
        run: npm run test:markdown-links
      - name: Validate public responsive navigation and keyboard behavior
        run: npm run test:public-navigation
      - name: Validate ecosystem SDK
        run: npm run test:ecosystem
      - name: Validate landing PWA contract
        run: npm run test:landing-pwa
      - name: Production build
        run: npm run build
      - name: Verify public landing build and SEO entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
          grep -q 'name="description"' dist/index.html
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'property="og:image"' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'Sitemap: https://petertecnet.com.br/sitemap.xml' dist/robots.txt
          echo "Landing build, assets and SEO entrypoints: PASS"
