name: Peter Tecnet Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate ecosystem SDK
        run: npm run test:ecosystem
      - name: Validate deploy safety guard
        run: bash scripts/validate-deploy-safety-guard.sh
      - name: Production build
        run: npm run build
      - name: Validate isolated ticket Admin surface in real browser
        run: npm run test:admin-ui
      - name: Upload ticket Admin viewport captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ticket-ui-viewports
          path: artifacts/admin-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify main production surfaces
        shell: bash
        run: |
          set -euo pipefail

          # petertecnet.com.br owns the public/marketing surface. The full Admin
          # Center lives on its dedicated branch/domain and must not leak back here.
          test -f src/main.jsx
          test -f src/entry.jsx
          test -f src/PublicExperienceRouter.jsx
          test -f src/MarketingHubApp.jsx
          test -f src/SupportPublicApp.jsx
          test -f src/AdminTicketSalesPage.jsx
          test -f src/AdminTicketSalesPage.css
          test -f src/components/PeterAccountGateway.jsx
          test -f scripts/validate-admin-ticket-sales.mjs
          test -f scripts/validate-admin-ticket-sales-browser.mjs
          test -f scripts/validate-ecosystem-sdk.mjs
          test -f public/ecosystem/peter-ecosystem-v3.js
          test -f public/ecosystem/peter-telemetry-v3.js

          test ! -f src/AdminEntry.jsx
          test ! -f src/Admin.jsx
          test ! -f src/CommandCenter.jsx
          test ! -d src/admin

          grep -q "AdminTicketSalesPage" src/main.jsx
          grep -q "legacy Admin shell was removed" src/main.jsx
          grep -q "'/admin/events/tickets'" src/main.jsx
          grep -q "'/admin/ingressos'" src/main.jsx
          grep -q "window.history.replaceState({}, '', '/')" src/main.jsx
          grep -q "PeterAccountGateway" src/main.jsx
          grep -q "path === '/suporte'" src/entry.jsx
          grep -q "SupportPublicApp.jsx" src/entry.jsx
          grep -q "peter-telemetry-v3.js" src/components/PeterAccountGateway.jsx
          grep -q "peter-ecosystem-v3.js" src/components/PeterAccountGateway.jsx
