      - name: Verify navigation and media contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "home: '/admin'" src/Admin.jsx
          grep -q "command: '/admin/mission-control'" src/Admin.jsx
          grep -q "data-establishment-media-slot" src/Admin.jsx
          grep -q "data-establishment-editor-id" src/Admin.jsx
          grep -q "establishment-page-preview" src/AdminEstablishmentMedia.jsx
          grep -q "editor.slot" src/AdminEstablishmentMedia.jsx
          grep -q "AdminHome" src/Admin.jsx
          grep -q "PlatformSwitcher" src/Admin.jsx
          grep -q "commandSectionFromLocation" src/CommandCenter.jsx
          test -s src/AdminHome.jsx
          test -s src/AdminEnhancements.css

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Peter Tecnet Automation"
          git config user.email "petertecnet@gmail.com"
          git add src/Admin.jsx src/CommandCenter.jsx src/AdminEstablishmentMedia.jsx src/AdminHome.jsx src/AdminEnhancements.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(admin): mature navigation and establishment visual editor"
          git pull --rebase origin main
          git push origin HEAD:main
