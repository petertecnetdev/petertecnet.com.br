name: Agent Control Validation

on:
  push:
    branches:
      - main
    paths:
      - '.agents/**'
      - 'AGENTS.md'
  pull_request:
    branches:
      - main
    paths:
      - '.agents/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent identities, tasks, locks and safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate control state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".agents")
          errors = []
          warnings = []

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON: {exc}")
                  return {}

          registry = load(root / "AGENTS_REGISTRY.json")
          agents = registry.get("agents") or []
          agent_ids = [str(agent.get("id") or "") for agent in agents]
          agent_id_set = set(agent_ids)

          if len(agent_ids) != len(agent_id_set):
              errors.append("AGENTS_REGISTRY.json: duplicated agent id")
          if any(not re.fullmatch(r"NP[0-9]{2}", agent_id) for agent_id in agent_ids):
              errors.append("AGENTS_REGISTRY.json: every external agent id must match NPxx")

          valid_statuses = {
              "NEW", "ASSIGNED", "RUNNING", "WAITING", "REVIEW", "DONE",
              "BLOCKED", "NEEDS_OWNER_DECISION", "CANCELLED",
          }
          valid_priorities = {"CRITICAL", "HIGH", "NORMAL", "LOW"}

          for path in sorted((root / "tasks").glob("TASK-*.json")):
              task = load(path)
              task_id = str(task.get("task_id") or "")
              if path.name != f"{task_id}.json":
                  errors.append(f"{path}: filename and task_id differ")
              if not re.fullmatch(r"TASK-[0-9]{8}-[A-Z0-9]{6}", task_id):
                  errors.append(f"{path}: invalid task_id {task_id!r}")

              status = task.get("status")
              priority = task.get("priority")
              if status not in valid_statuses:
                  errors.append(f"{path}: invalid status {status!r}")
              if priority not in valid_priorities:
                  errors.append(f"{path}: invalid priority {priority!r}")

              for key in ("assigned_agent_id", "owner_agent_id"):
                  value = task.get(key)
                  if value and value not in agent_id_set:
                      errors.append(f"{path}: {key} references unknown agent {value}")

              review = task.get("review") or {}
              reviewer = review.get("reviewer_agent_id")
              if reviewer and reviewer not in agent_id_set:
                  errors.append(f"{path}: review references unknown agent {reviewer}")

              delegation_count = int(task.get("delegation_count") or 0)
              max_delegations = int(task.get("max_delegations") or 2)
              if delegation_count > max_delegations:
                  errors.append(f"{path}: delegation_count exceeds max_delegations")

              lock = task.get("lock") or {}
              if status == "RUNNING":
                  if not lock.get("owner_agent_id") or not lock.get("expires_at"):
                      errors.append(f"{path}: RUNNING task requires active owner lock")
                  if lock.get("owner_agent_id") and lock.get("owner_agent_id") not in agent_id_set:
                      errors.append(f"{path}: lock owner is not registered")

              if status == "DONE":
                  evidence = task.get("evidence") or []
                  if not evidence:
                      errors.append(f"{path}: DONE requires at least one evidence item")
                  if review.get("required") and review.get("status") != "APPROVED":
                      errors.append(f"{path}: DONE requires APPROVED review")

              applied = task.get("applied_operation_ids") or []
              if len(applied) != len(set(applied)):
                  errors.append(f"{path}: duplicated applied_operation_ids")

          state_dir = root / "state"
          for path in sorted(state_dir.glob("NP*.json")):
              state = load(path)
              agent_id = str(state.get("agent_id") or "")
              if agent_id not in agent_id_set:
                  errors.append(f"{path}: state references unknown agent {agent_id}")
              if path.stem != agent_id:
                  errors.append(f"{path}: filename and agent_id differ")
              read_ids = state.get("read_message_ids") or []
              if not isinstance(read_ids, list):
                  errors.append(f"{path}: read_message_ids must be a list")
              elif len(read_ids) > 200:
                  errors.append(f"{path}: read_message_ids exceeds 200 entries")
              received = state.get("received_task_ids") or []
              if not isinstance(received, list):
                  errors.append(f"{path}: received_task_ids must be a list")

          # Public coordination files must not contain obvious credentials.
          secret_patterns = [
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bBearer\s+[A-Za-z0-9._~-]{24,}\b", re.I),
          ]
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for pattern in secret_patterns:
                  if pattern.search(text):
                      errors.append(f"{path}: possible secret detected ({pattern.pattern})")
                      break

          if warnings:
              print("\n".join(f"WARNING: {warning}" for warning in warnings))

          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors), file=sys.stderr)
              sys.exit(1)

          print(f"Agent Control validation passed: {len(agent_ids)} agents.")
          PY
