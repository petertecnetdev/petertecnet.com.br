        ]

        const appendScript = ({ src, attrs = {} }) => new Promise(resolve => {
          const script = document.createElement('script')
          script.src = src
          script.async = true
          Object.entries(attrs).forEach(([name, value]) => script.setAttribute(name, value))
          script.addEventListener('load', resolve, { once: true })
          script.addEventListener('error', resolve, { once: true })
          document.head.appendChild(script)
        })

        const loadOptionalScripts = async () => {
          for (const descriptor of optionalScripts) await appendScript(descriptor)
        }

        const scheduleOptionalScripts = () => {
          if ('requestIdleCallback' in window) window.requestIdleCallback(() => void loadOptionalScripts(), { timeout: 2500 })
          else window.setTimeout(() => void loadOptionalScripts(), 1200)
        }

        if (document.readyState === 'complete') scheduleOptionalScripts()
        else window.addEventListener('load', scheduleOptionalScripts, { once: true })
      })()
